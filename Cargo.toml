[package]
name = "rustblox"
version = "1.0.0"
edition = "2021"
description = "Voxel sandbox in Rust + macroquad: procedural worlds, Creative/Survival, crafting and ores"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
